name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests demo
      - name: Type check core utilities
        run: mypy -m metrics -m retriever -m routing -m train_router
      - name: Test
        run: pytest --cov=metrics --cov=retriever --cov=routing --cov-report=term-missing --cov-fail-under=90
