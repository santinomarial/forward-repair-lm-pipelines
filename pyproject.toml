[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Start with correctness-oriented rules so CI catches syntax/name errors without
# forcing a formatting rewrite of the existing research scripts.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "rank_bm25"
ignore_missing_imports = true
